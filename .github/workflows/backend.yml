name: backend

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 迁移可升可降（迁移测试会单独跑，这里先确保 CLI 可用）
        run: |
          export CGA_DATABASE_URL="sqlite:///${{ runner.temp }}/ci.db"
          python -m alembic upgrade head
          python -m alembic downgrade base

      - name: pytest
        run: python -m pytest -q

      # 契约与实现必须一致：新增端点漏写 docs/api-contract.md 直接红灯。
      # 从仓库根跑（脚本自己把 backend/ 加进 sys.path）。
      - name: 契约一致性
        working-directory: .
        run: python tools/contract_diff.py --strict
